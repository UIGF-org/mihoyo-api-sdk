components:
  parameters:
    UIGF.Game.GameRecordQuery.roleId:
      name: role_id
      in: query
      required: true
      schema:
        type: string
      explode: false
    UIGF.Game.GameRecordQuery.server:
      name: server
      in: query
      required: true
      schema:
        type: string
      explode: false
    UIGF.Game.ScheduleRecordQuery.needAll:
      name: need_all
      in: query
      required: false
      schema:
        type: boolean
      explode: false
    UIGF.Game.ScheduleRecordQuery.needDetail:
      name: need_detail
      in: query
      required: false
      schema:
        type: boolean
      explode: false
    UIGF.Game.ScheduleRecordQuery.scheduleType:
      name: schedule_type
      in: query
      required: false
      schema:
        type: integer
        format: int32
      explode: false
  schemas:
    UIGF.Announcement:
      type: object
      properties:
        ann_id:
          type: integer
          format: int64
        title:
          type: string
        subtitle:
          type: string
        banner:
          type: string
        content:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        type:
          type: integer
          format: int32
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.AnnouncementList:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/UIGF.Announcement"
        alert:
          type: boolean
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.Commerce.BonusDescription:
      type: object
      properties:
        bonus_desc:
          type: string
        bonus_unit:
          type: integer
          format: int32
        bonus_goods_id:
          type: string
        bonus_icon:
          type: string
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.Commerce.CreateOrderRequest:
      type: object
      required:
        - order
        - sign
      properties:
        open_id:
          type: string
        special_info:
          type: string
        order:
          $ref: "#/components/schemas/UIGF.JsonObject"
        sign:
          type: string
      allOf:
        - type: object
          additionalProperties: {}
      description: >-
        Vendor-signed order creation payload. `sign` must come from an
        authorized

        official client or payment integration; this SDK intentionally does not

        implement signing or retain payment secrets.
    UIGF.Commerce.OrderStatus:
      type: object
      properties:
        status:
          type: integer
          format: int32
        amount:
          type: string
        goods_num:
          type: string
        goods_title:
          type: string
        order_no:
          type: string
        pay_plat:
          type: string
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.Commerce.ShopGood:
      type: object
      required:
        - goods_id
        - goods_name
      properties:
        goods_id:
          type: string
        goods_name:
          type: string
        goods_type:
          type: string
        goods_unit:
          type: string
        goods_icon:
          type: string
        currency:
          type: string
        price:
          type: string
        symbol:
          type: string
        tier_id:
          type: string
        bonus_desc:
          $ref: "#/components/schemas/UIGF.Commerce.BonusDescription"
        once_bonus_desc:
          type: object
          allOf:
            - $ref: "#/components/schemas/UIGF.Commerce.BonusDescription"
          nullable: true
        available:
          type: boolean
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.Commerce.ShopGoods:
      type: object
      required:
        - goods_list
      properties:
        goods_list:
          type: array
          items:
            $ref: "#/components/schemas/UIGF.Commerce.ShopGood"
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.Community.Forum:
      type: object
      properties:
        id:
          type: integer
          format: int32
        game_id:
          type: integer
          format: int32
        name:
          type: string
        icon:
          type: string
      allOf:
        - type: object
          additionalProperties: {}
    UIGF.Community.ForumList:
      type: object
      properties:
        list:
          type: array
