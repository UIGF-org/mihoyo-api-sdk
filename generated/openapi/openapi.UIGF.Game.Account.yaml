openapi: 3.0.0
info:
  title: UIGF MiHoYo Game Account API
  description: CN game-account binding, Gacha auth-key, OBC, and cultivation
    calculator APIs.
  version: 0.0.0
tags: []
paths:
  /account/ma-cn-session/app/getTokenByGameToken:
    post:
      operationId: GameTokenApi_exchangeGameToken
      description: Exchanges the official game-token QR-login result for a session token.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.Passport.TokenInfo"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIGF.Passport.GameTokenRequest"
  /auth/api/getActionTicketBySToken:
    get:
      operationId: ActionTicketApi_getBySToken
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UIGF.Game.ActionTicketQuery.action_type"
        - $ref: "#/components/parameters/UIGF.Game.ActionTicketQuery.stoken"
        - $ref: "#/components/parameters/UIGF.Game.ActionTicketQuery.uid"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      x-uigf-ds:
        generation: v2
        header: DS
        canonicalization:
          body: exact-serialized
          query: lexicographic-segments
  /binding/api/genAuthKey:
    post:
      operationId: BindingApi_generateAuthKey
      description: Generates an authenticated gacha authkey for a selected game role.
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIGF.Game.AuthKeyRequest"
      x-uigf-ds:
        generation: v1
        header: DS
  /binding/api/getUserGameRolesByCookie:
    get:
      operationId: BindingApi_getRoles
      description: Lists game roles that are bound to the authenticated community account.
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: false
          schema:
            type: string
        - name: game_biz
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.GameRoleList"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
  /common/blackboard/ys_obc/v1/gacha_pool:
    get:
      operationId: GenshinObcApi_getGachaPool
      parameters:
        - name: app_sn
          in: query
          required: true
          schema:
            type: string
            default: ys_obc
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
  /common/blackboard/ys_obc/v1/home/position:
    get:
      operationId: GenshinObcApi_getHomePositions
      parameters:
        - name: app_sn
          in: query
          required: true
          schema:
            type: string
            default: ys_obc
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
  /event/e20200928calculate/v1/avatar/list:
    post:
      operationId: CultivationApi_listAvatars
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIGF.Game.CalculateRequest"
      x-uigf-ds:
        generation: v2
        header: DS
        canonicalization:
          body: exact-serialized
          query: lexicographic-segments
  /event/e20200928calculate/v1/sync/avatar/list:
    post:
      operationId: CultivationApi_syncAvatarList
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIGF.Game.CalculateRequest"
      x-uigf-ds:
        generation: v2
        header: DS
        canonicalization:
          body: exact-serialized
          query: lexicographic-segments
  /event/e20200928calculate/v1/weapon/list:
    post:
      operationId: CultivationApi_listWeapons
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIGF.Game.CalculateRequest"
      x-uigf-ds:
        generation: v2
        header: DS
        canonicalization:
          body: exact-serialized
          query: lexicographic-segments
  /event/e20200928calculate/v3/batch_compute:
    post:
      operationId: CultivationApi_batchCompute
      description: Calculates material consumption for a batch of characters and weapons.
      parameters:
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
        - name: DS
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - retcode
                  - message
                  - data
                properties:
                  retcode:
                    type: integer
                    format: int32
                    description: Vendor result code. `0` normally represents success.
                  message:
                    type: string
                    description: Vendor diagnostic message.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UIGF.JsonObject"
                    description: Endpoint-specific payload.
                description: Common response wrapper returned by MiHoYo and HoYoLAB services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIGF.Game.CalculateRequest"
      x-uigf-ds:
