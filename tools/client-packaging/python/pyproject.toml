[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uigf-mihoyo"
version = "0.1.0"
description = "MiHoYo, MiYouShe, HoYoLAB and HoYoverse clients generated by the official TypeSpec emitter."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["corehttp[requests]>=1.0.0b6", "isodate>=0.6.1", "typing-extensions>=4.6.0"]

[project.optional-dependencies]
aio = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
# Include the root package: shared models import uigf.types at runtime.
include = ["uigf*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
